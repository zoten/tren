[package]
name = "tren"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1.87"
clap = { version = "4.5.29", features = ["cargo"] }
csv = "1.3.1"
csv-async = "1.3.0"
futures = "0.3.31"
futures-util = "0.3.31"
rand = "0.9.0"
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "rt",
    "macros",
    "rt-multi-thread",
] }
tokio-util = { version = "0.7.13", features = ["compat"] }
# tokio-stream = { version = "0.1.17", features = ["tokio-util"] }

[lints.rust]
unsafe_code = "forbid"
   
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# nursery = { level = "warn", priority = -1 }
# Would probably deny both in production
# unwrap_used = "deny"
# expect_used = "warn"
# panic = "deny"
